<div style="margin-bottom:1rem; text-indent:20px"><div style="margin-top:1em; margin-bottom:1em;"><span style="color:#2d3748; font-weight:bold; font-size:14px;">“God save you, stranger — whence are you?”</span></div><span style="color:#4a5568; font-size:14px;"> she says, and means it entirely.</span></div>
<div style="margin-bottom:1rem; text-indent:20px"><div style="margin-top:1em; margin-bottom:1em;"><span style="color:#2d3748; font-weight:bold; font-size:14px;">“You are very welcome here. I want you to know that first, before anything else.”</span></div></div>
